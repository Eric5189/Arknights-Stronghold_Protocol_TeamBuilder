<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卫戍协议小队规划工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>卫戍协议小队规划工具</h1>
    <div id="mode-switcher">
      <button id="btn-mode-squad" class="mode-btn active">🗂 组队模式</button>
      <button id="btn-mode-ban" class="mode-btn">🚫 禁用模式</button>
      <span id="ban-count-badge" class="ban-count-badge hidden">已禁用 <span id="ban-count-num">0</span> 人</span>
      <button id="btn-clear-ban" class="hidden">清空禁用</button>
    </div>
  </header>

  <main>

    <!-- ===== 左侧面板：筛选 + 干员列表 ===== -->
    <div id="panel-left">

      <div id="filter-bar">
        <details class="filter-section filter-section-cost" data-category="cost" open>
          <summary class="filter-section-label">费用<span class="filter-summary-hint"></span></summary>
          <div class="filter-tag-group" id="filter-tags-cost"></div>
        </details>
        <details class="filter-section filter-section-main" data-category="mainTrait" open>
          <summary class="filter-section-label">主羁绊<span class="filter-summary-hint"></span></summary>
          <div class="filter-tag-group" id="filter-tags-main"></div>
        </details>
        <details class="filter-section filter-section-sub" data-category="subTrait" open>
          <summary class="filter-section-label">子羁绊<span class="filter-summary-hint"></span></summary>
          <div class="filter-tag-group" id="filter-tags-sub"></div>
        </details>
        <details class="filter-section filter-section-ability" data-category="tag" open>
          <summary class="filter-section-label">特质 Tag<span class="filter-summary-hint"></span></summary>
          <div class="filter-tag-group" id="filter-tags-ability"></div>
        </details>
        <div id="filter-footer">
          <button id="btn-reset-filter">重置筛选</button>
        </div>
      </div>

      <div id="operator-count-bar">
        <span id="operator-count-text"></span>
        <label id="label-hide-banned">
          <input type="checkbox" id="chk-hide-banned"> 隐藏已禁用
        </label>
      </div>

      <div id="operator-list"></div>

    </div>

    <!-- ===== 右侧面板：小队 + 羁绊统计 ===== -->
    <div id="panel-right">

      <!-- 羁绊禁用面板（禁用模式下替代小队面板） -->
      <div id="ban-trait-panel" class="hidden">
        <div class="panel-header">
          <h2>羁绊禁用</h2>
          <button id="btn-clear-ban-traits">清空选择</button>
          <button id="btn-ban-done" class="btn-done">✓ 完成</button>
        </div>
        <div id="ban-trait-selector">
          <div class="ban-trait-section">
            <div class="ban-trait-section-title">主羁绊 &nbsp;<span id="ban-main-count">0</span>/5</div>
            <div class="filter-tag-group" id="ban-tags-main"></div>
          </div>
          <div class="ban-trait-section">
            <div class="ban-trait-section-title">副羁绊 &nbsp;<span id="ban-sub-count">0</span>/5</div>
            <div class="filter-tag-group" id="ban-tags-sub"></div>
          </div>
        </div>
        <div id="ban-trait-result">
          <div class="ban-trait-result-title">自动禁用干员 &nbsp;<span id="ban-auto-count">0</span> 人</div>
          <div id="ban-auto-ops"><p class="empty-hint">暂无自动禁用干员</p></div>
        </div>
      </div>

      <div id="squad-panel">
        <div class="panel-header">
          <h2>当前小队</h2>
          <span id="squad-count-badge">0 / 8</span>
          <label id="label-unlock-9" title="携带特殊道具后可解锁第9格">
            <input type="checkbox" id="chk-unlock-9"> 人事部档案
          </label>
          <button id="btn-sort-squad">按费用排序</button>
          <button id="btn-clear-squad">清空</button>
        </div>
        <div id="squad-list">
          <p class="empty-hint">点击干员卡片来加入</p>
        </div>
      </div>

      <div id="panel-right-resizer" role="separator" aria-label="调整当前小队和羁绊统计区域高度"></div>

      <div id="trait-panel">
        <div class="panel-header">
          <h2>羁绊统计</h2>
          <label id="label-hide-inactive" title="隐藏未激活的羁绊">
            <input type="checkbox" id="chk-hide-inactive"> 仅显示已激活
          </label>
        </div>
        <div id="trait-list">
          <p class="empty-hint">小队为空</p>
        </div>
      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
